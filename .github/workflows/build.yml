name: Build Custom MaxVibe APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install apktool
        run: |
          sudo wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O /usr/local/bin/apktool
          sudo wget -q https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.10.0.jar -O /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar

      - name: Download base MaxVibe 4.1.3 APK
        run: |
          wget -q "https://github.com/dorofo/max-vibe/releases/download/4.1.3/max_vibe-release.apk" -O base.apk

      - name: Decompile APK
        run: |
          apktool d base.apk -o decoded -f

      - name: Apply custom Smali patches
        run: |
          cp -rf patches/* decoded/

      - name: Rebuild APK
        run: |
          apktool b decoded -o unsigned.apk

      - name: Sign APK
        run: |
          java -jar uber-apk-signer-1.3.0.jar --apks unsigned.apk --out dist/

      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: maxvibe-custom-signed
          path: dist/*.apk
