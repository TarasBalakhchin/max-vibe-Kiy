name: Extract Target Smali

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install apktool
        run: |
          sudo wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O /usr/local/bin/apktool
          sudo wget -q https://bitbucket.org/iBotPeaches/Apktool/downloads/apktool_2.10.0.jar -O /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar

      - name: Download and decompile MaxVibe 4.1.3
        run: |
          wget -q "https://github.com/dorofo/max-vibe/releases/download/4.1.3/max_vibe-release.apk" -O base.apk
          apktool d base.apk -o decoded -f

      - name: Extract mvibedev classes and search calls
        run: |
          mkdir -p extracted/smali/ru/oneme
          cp -r decoded/smali/ru/oneme/mvibedev extracted/smali/ru/oneme/
          ls -1 decoded/smali/ru/oneme/mvibedev > extracted/files_list.txt
          grep -rnE "MvibeTelegramHelper|openCommunity|t\.me/max_vibe" decoded/smali* > extracted/telegram_calls.txt || echo "No direct matches found" > extracted/telegram_calls.txt

      - name: Upload extracted files
        uses: actions/upload-artifact@v4
        with:
          name: found-smali-files
          path: extracted/
